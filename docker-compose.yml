name: sistema_requerimientos_profesional
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: presupuesto
      POSTGRES_USER: presupuesto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presupuesto -d presupuesto"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      DATABASE_URL: postgresql+psycopg://presupuesto:${POSTGRES_PASSWORD:-cambiar-esta-clave}@db:5432/presupuesto
      SECRET_KEY: ${SECRET_KEY:-desarrollo-local-clave-secreta-32-caracteres}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-2026}
      SECURE_COOKIES: "false"
      TRUSTED_PROXY_COUNT: "0"
      AUTO_CREATE_SCHEMA: "false"
      SEED_ON_STARTUP: "false"
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  postgres_data:
